[project]
name = "bap-browser"
version = "0.1.0"
description = "A browser that AI agents can use and that a person can watch and control."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.63,<2",
    "pydantic>=2.13,<3",
]

[project.scripts]
bap-browser = "bap_browser.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bap_browser"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Documents are not code: the formatter must not rewrite the examples inside them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# The formatter wraps code; a long string that it cannot wrap is not an error.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests read small files directly inside async test functions.
"tests/**" = ["ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
