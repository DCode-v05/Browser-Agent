<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus moves</title>
</head>
<body>
<p><label for="search">Search</label> <input id="search"></p>
<p><label for="password">Password</label> <input id="password" type="password"></p>
<script>
document.getElementById('password').addEventListener('focus', () => document.getElementById('search').focus());
</script>
</body>
</html>
