<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialogs</title>
</head>
<body>
<h1>Dialogs</h1>
<button id="hello">Say hello</button>
<button id="ask">Ask to proceed</button>
<button id="name">Ask my name</button>
<button id="twice">Ask twice</button>
<button id="go">Ask, then go on</button>
<button id="guard">Guard this page</button>
<a href="welcome.html?name=Elsewhere">Go elsewhere</a>
<button id="later">Ask in a moment</button>
<p id="said">Nothing yet</p>
<script>
const said = (text) => { document.getElementById('said').textContent = text; };
const on = (id, act) => document.getElementById(id).addEventListener('click', act);
on('hello', () => { alert('Hello there'); said('The alert was closed'); });
on('ask', () => said(confirm('Proceed?') ? 'Proceeded' : 'Stayed'));
on('name', () => { const name = prompt('Your name?', 'nobody'); said(name === null ? 'No name' : 'Name: ' + name); });
on('twice', () => { const first = confirm('First?'); const second = confirm('Second?'); said('First ' + first + ', second ' + second); });
on('go', () => { if (confirm('Go on?')) location.href = 'welcome.html?name=Onward'; else said('Stayed here'); });
on('guard', () => {
  addEventListener('beforeunload', (event) => { event.preventDefault(); event.returnValue = ''; });
  said('Guarded');
});
on('later', () => setTimeout(() => said(confirm('Still there?') ? 'Still there' : 'Gone'), 150));
</script>
</body>
</html>
