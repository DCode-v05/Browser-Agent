<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session ended</title>
</head>
<body>
<h1>Your session has ended</h1>
<button onclick="again()">Sign in again</button>
<script>
function again() {
  var form = '<!doctype html><title>Sign in</title><h1>Sign in</h1>' +
    '<label>Email <input name="email"></label>' +
    '<label>Password <input type="password" name="password"></label><button>Continue</button>';
  location.href = URL.createObjectURL(new Blob([form], {type: 'text/html'}));
}
</script>
</body>
</html>
