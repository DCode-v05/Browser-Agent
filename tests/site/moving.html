<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moving</title>
<style>
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(300px); } }
button { animation: slide 0.3s linear infinite alternate; }
</style>
</head>
<body>
<button>Catch me</button>
</body>
</html>
