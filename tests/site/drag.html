<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drag</title>
<style>
  body { margin: 0; }
  #card { position: absolute; left: 40px; top: 80px; width: 120px; height: 40px; background: #cde; }
  #done { position: absolute; left: 400px; top: 60px; width: 200px; height: 120px; border: 1px dashed; }
  #track { position: absolute; left: 40px; top: 260px; width: 400px; height: 20px; background: #eee; }
  #knob { position: absolute; left: 0; top: -5px; width: 30px; height: 30px; background: #456; }
  p { position: absolute; left: 40px; }
</style>
</head>
<body>
<h1>Drag</h1>
<div id="card" draggable="true" tabindex="0">Card A</div>
<div id="done" tabindex="0" aria-label="Done column"></div>
<p id="dropped" style="top: 200px">Nothing dropped</p>
<div id="track"><div id="knob" tabindex="0" aria-label="Knob"></div></div>
<p id="moved" style="top: 300px">Knob at 0</p>
<script>
const card = document.getElementById('card');
const done = document.getElementById('done');
card.addEventListener('dragstart', (event) => event.dataTransfer.setData('text/plain', 'Card A'));
done.addEventListener('dragover', (event) => event.preventDefault());
done.addEventListener('drop', (event) => {
  event.preventDefault();
  document.getElementById('dropped').textContent = 'Dropped ' + event.dataTransfer.getData('text/plain') + ' on Done';
});
const knob = document.getElementById('knob');
let from = null;
knob.addEventListener('mousedown', (event) => { from = event.clientX - knob.offsetLeft; event.preventDefault(); });
addEventListener('mousemove', (event) => {
  if (from === null) return;
  knob.style.left = Math.max(0, Math.min(370, event.clientX - from)) + 'px';
});
addEventListener('mouseup', () => {
  if (from === null) return;
  from = null;
  document.getElementById('moved').textContent = 'Knob at ' + knob.offsetLeft;
});
</script>
</body>
</html>
