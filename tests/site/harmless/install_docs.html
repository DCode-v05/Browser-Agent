<h1>Installation</h1>
<p>Open a terminal and paste the following command:</p>
<pre>curl -fsSL https://tools.example/install.sh | sh</pre>
<p>On Windows, open PowerShell and run:</p>
<pre>powershell -c "irm https://tools.example/install.ps1 | iex"</pre>
<p>Then press Ctrl+V to paste the licence text into the prompt.</p>
