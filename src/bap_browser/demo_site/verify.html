<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify your email</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<header>
  <div class="brand"><i></i>Northfield</div>
  <div class="spacer"></div>
  <span class="pill">Step 2 of 2</span>
</header>
<main class="narrow">
  <form class="card" action="welcome.html">
    <h1>Check your email</h1>
    <p class="lead">We sent a 6-digit code to <b>ada@example.com</b>. Enter it here to finish creating your account.</p>
    <div class="field"><label for="code">Verification code</label><input id="code" class="code" type="text" inputmode="numeric" placeholder="······"></div>
    <button class="primary" id="continue" type="submit">Continue</button>
    <p class="muted" style="margin: 16px 0 0">Didn't get it? Resend the code in 0:42</p>
  </form>
</main>
</body>
</html>
