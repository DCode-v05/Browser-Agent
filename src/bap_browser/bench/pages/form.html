<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bench form</title></head>
<body>
<h1>Bench form</h1>
<form onsubmit="return false">
  <p><label for="name">Full name</label> <input id="name"></p>
  <p><label for="email">Email</label> <input id="email" type="email"></p>
  <p><label for="city">City</label> <input id="city"></p>
  <p><label for="phone">Phone</label> <input id="phone"></p>
  <p><label for="country">Country</label>
    <select id="country"><option>--</option><option>India</option><option>United States</option></select></p>
  <p><label><input type="checkbox" id="terms"> I accept the terms</label></p>
  <p><button type="button" id="save">Save</button></p>
</form>
<p>The form is ready.</p>
</body>
</html>
