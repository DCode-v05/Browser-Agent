name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The viewer first: the Python tests open the built viewer in a real browser.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm --prefix viewer ci
      - run: npm --prefix viewer run typecheck
      - run: npm --prefix viewer run lint
      - run: npm --prefix viewer run test
      - run: npm --prefix viewer run build

      # The desktop app's shell and the part of its main process that can be tested without a window.
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop run test
      - run: npm --prefix desktop run build

      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
        env:
          # Hosted runners do not allow the user namespaces Chromium's sandbox needs.
          BAP_BROWSER__BROWSER__CHROMIUM_SANDBOX: "false"

  # Computer use is the same on Windows, macOS and Linux (spec 22.10.1). On each system the tests of
  # the base run, the pinned driver is installed, and the ladder is climbed against a real app on
  # the runner's own screen, once directly and once as an engine elsewhere would, through the helper.
  # On Linux and Windows the ladder must pass. On macOS it cannot go past
  # rung 1: nobody is there to allow the driver, so what it says is printed and the job goes on.
  computer-on-each-system:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/unit/test_hermes_base.py tests/unit/test_driver_install.py tests/unit/test_computer_use_tool.py tests/unit/test_machine_helper.py tests/unit/test_remote_machine.py tests/unit/test_allowed_apps.py tests/unit/test_contained_on_hermes.py tests/unit/test_dock.py tests/hermes -q
      - run: uv run bap-browser computer install
      - run: uv run bap-browser computer doctor || echo "The doctor found something on this runner."
        shell: bash
      # Linux has no screen on a runner: a virtual one, the accessibility bus and one small app.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb at-spi2-core dbus-x11 zenity openbox xdotool imagemagick x11-utils x11-xserver-utils
          dbus-run-session -- xvfb-run -a uv run python scripts/ladder.py
          dbus-run-session -- xvfb-run -a uv run python scripts/ladder.py --through-helper
          # With the person's switch on, the agent is not held to the allowed apps.
          dbus-run-session -- xvfb-run -a uv run python scripts/ladder.py --any-app
          # As in the micro VM: no screen is given, and the engine starts the machine's own.
          dbus-run-session -- uv run python scripts/ladder.py --virtual-screen
          # The contained desktop: its image is built, the driver is put inside its container, and the
          # engine reaches it through the dock.
          docker build -q -t bap-browser-desktop:latest -f deploy/desktop.Dockerfile deploy
          uv run python scripts/ladder.py --contained
      - if: runner.os == 'Windows'
        run: uv run python scripts/ladder.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/ladder.py --through-helper
      # With the person's switch on, every app is reached: File Explorer and Windows Terminal too,
      # which the list of allowed apps cannot name.
      - if: runner.os == 'Windows'
        run: uv run python scripts/ladder.py --any-app
      # With the setting on, the installer has the driver register its own logon task (spec 22.10).
      - if: runner.os == 'Windows'
        name: The driver's logon task is registered when the settings ask for it
        shell: bash
        env:
          BAP_BROWSER__COMPUTER__BASE__AUTOSTART: "true"
        run: |
          uv run bap-browser computer install
          uv run python - <<'EOF'
          import subprocess, sys
          from bap_browser import computer
          from bap_browser.computer import driver
          from bap_browser.config import load_config
          binary = driver.installed(computer.home_of(load_config()))
          said = subprocess.run([str(binary), "autostart", "status"], capture_output=True, text=True).stdout.strip()
          print(said)
          sys.exit(0 if said.startswith("registered") else 1)
          EOF
      - if: runner.os == 'macOS'
        run: uv run python scripts/ladder.py || echo "On macOS the ladder waits for a person to allow the driver."
        shell: bash
