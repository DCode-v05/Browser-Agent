name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The viewer first: the Python tests open the built viewer in a real browser.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm --prefix viewer ci
      - run: npm --prefix viewer run typecheck
      - run: npm --prefix viewer run lint
      - run: npm --prefix viewer run test
      - run: npm --prefix viewer run build

      # The desktop app's shell and the part of its main process that can be tested without a window.
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop run test
      - run: npm --prefix desktop run build

      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
        env:
          # Hosted runners do not allow the user namespaces Chromium's sandbox needs.
          BAP_BROWSER__BROWSER__CHROMIUM_SANDBOX: "false"

  # Computer use is the same on Windows, macOS and Linux (spec 22.10.1). The tests of the base run on
  # each, and the pinned driver is installed and asked what it can do: rung 1 of the ladder. What a
  # hosted runner's screen allows beyond that is printed, and does not fail the job.
  computer-on-each-system:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/unit/test_hermes_base.py tests/unit/test_driver_install.py tests/hermes -q
      - run: uv run bap-browser computer install
      - run: uv run bap-browser computer permissions || echo "The driver is not ready on this runner."
        shell: bash
      - run: uv run bap-browser computer doctor || echo "The doctor found something on this runner."
        shell: bash
      - run: uv run python scripts/ladder.py || echo "The ladder did not pass on this runner."
        shell: bash
