name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The viewer first: the Python tests open the built viewer in a real browser.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm --prefix viewer ci
      - run: npm --prefix viewer run typecheck
      - run: npm --prefix viewer run lint
      - run: npm --prefix viewer run test
      - run: npm --prefix viewer run build

      # The desktop app's shell and the part of its main process that can be tested without a window.
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop run test
      - run: npm --prefix desktop run build

      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
        env:
          # Hosted runners do not allow the user namespaces Chromium's sandbox needs.
          BAP_BROWSER__BROWSER__CHROMIUM_SANDBOX: "false"
